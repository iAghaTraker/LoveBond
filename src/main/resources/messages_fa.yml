# ------------------------------------------------------------------
#  پیام‌های فارسی LoveBond
#  برای استفاده: صرفاً محتوای همین فایل را داخل messages.yml کپی کنید
#  (یا کلیدهای دلخواه را در messages.yml جایگزین کنید)
#  برای رنگ و فونت، از کدهای & استفاده کنید. بسته به رایانهٔ بازیکن،
#  نمایش حروف فارسی به فونت و نسخهٔ کلاینت بستگی دارد.
#  -----------------------------------------------------------------
prefix: '&d&l[&5عشق پیوند&d&l] &r'

# ---- پیشنهاد ----
proposal-sent: '{prefix}&7پیشنهاد ازدواجت برای &e{player} &7ارسال شد!'
proposal-sent-gui: '{prefix}&e{player} &7به تو پیشنهاد ازدواج داده! بنویس &a/marry accept &7یا از منو استفاده کن.'
proposal-already-sent: '{prefix}&cتو همین الان یک پیشنهاد در انتظار داری!'
proposal-target-married: '{prefix}&c{player} &cاز قبل ازدواج کرده!'
proposal-self: '{prefix}&cنمی‌توانی با خودت ازدواج کنی!'
proposal-already-married: '{prefix}&cتو قبلاً با &e{partner} &cازدواج کرده‌ای!'
proposal-expired: '{prefix}&cپیشنهاد &e{player} &cمنقضی شد.'
proposal-target-offline: '{prefix}&c{player} &cآفلاین است.'
