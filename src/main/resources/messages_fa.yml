proposal-cooldown: '{prefix}&cباید &e{seconds} &cثانیه صبر کنی تا دوباره پیشنهاد بدهی.'

# ---- پذیرش / رد ----
marriage-announce: '{prefix}&d{player1} &7و &d{player2} &7با هم ازدواج کردند! &d&lتبریک! &a&oتا ابد عاشقانه کنار هم بمانند!'
proposal-accepted: '{prefix}&7تو با &e{player} &7ازدواج کردی! &d&lتبریک! &a&oزندگی شادتان!'
